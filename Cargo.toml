[package]
name = "test-bare-metal-pico-rs-webserver"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.5"
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
cyw43-setup = "0.1.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-net = { version = "0.9.0", features = ["tcp", "udp", "raw", "dhcpv4", "dns"] }
embassy-rp = { version = "0.10.0", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-sync = "0.8.0"
embassy-time= "0.5.1"
embassy-usb = "0.6.0"
embedded-io-async = "0.7.0"
heapless = "0.9.2"
static_cell = "2.1.1"
